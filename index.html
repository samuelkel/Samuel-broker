bottom:20px;left:50%;transform:translateX(-50%);background:#e9f4ff;color:#071226;border-radius:11px;padding:12px 18px;font-weight:750;box-shadow:var(--shadow);z-index:99;max-width:90vw}.search{padding:9px 12px;border:1px solid var(--line);background:#0a1324;border-radius:10px;color:white;min-width:0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px}.profile-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.profile-row:last-child{border:0}.mobile-nav{display:none}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const coins=[
{id:'BTC',name:'Bitcoin',symbol:'₿',cls:'btc',price:67420.18,change:2.43,cap:'$1.33T',spark:[3,6,4,8,7,12,10,14,12,18,16,22]},
{id:'ETH',name:'Ethereum',symbol:'◆',cls:'eth',price:3528.64,change:1.86,cap:'$423.8B',spark:[5,3,6,4,8,7,10,8,13,12,15,17]},
{id:'SOL',name:'Solana',symbol:'S',cls:'sol',price:164.27,change:-0.82,cap:'$74.2B',spark:[13,11,14,9,11,8,12,10,7,8,5,6]},
{id:'USDT',name:'Tether',symbol:'₮',cls:'usdt',price:1.00,change:0.02,cap:'$112.4B',spark:[8,9,8,8,9,8,8,9,8,9,8,9]},
{id:'XRP',name:'XRP',symbol:'X',cls:'xrp',price:0.6241,change:1.21,cap:'$34.1B',spark:[3,4,5,4,7,6,8,6,9,10,9,13]},

];
const fmt=n=>n>=1000?'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:n<1?4:2});
function icon(c){return `<span class="coin-symbol ${c.cls}">${c.symbol}</span>`}
function spark(c){let pts=c.spark.map((v,i)=>`${i*5},${23-v}`).join(' ');return `<svg class="spark" viewBox="0 0 58 24" aria-label="Illustrative trend"><polyline points="${pts}" fill="none" stroke="${c.change>=0?'#32d49a':'#ff6c86'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function chart(id='chart',height=180){return `<svg id="${id}" class="portfolio-chart" viewBox="0 0 700 ${height}" preserveAspectRatio="none" role="img" aria-label="Illustrative portfolio trend chart"><defs><linearGradient id="${id}grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#35cfff" stop-opacity=".28"/><stop offset="100%" stop-color="#35cfff" stop-opacity="0"/></linearGradient></defs>${[25,65,105,145].map(y=>`<line x1="0" x2="700" y1="${y}" y2="${y}" class="chart-grid"/>`).join('')}<path d="M0 140 C35 130 45 145 80 120 S130 115 165 126 S215 70 255 94 S310 105 350 68 S405 95 445 62 S505 78 540 43 S610 66 640 30 S675 38 700 18 L700 ${height} L0 ${height} Z" fill="url(#${id}grad)"/><path d="M0 140 C35 130 45 145 80 120 S130 115 165 126 S215 70 255 94 S310 105 350 68 S405 95 445 62 S505 78 540 43 S610 66 640 30 S675 38 700 18" class="chart-line"/></svg>`}
function marketsTable(){return `<div class="table-wrap"><table><thead><tr><th>ASSET</th><th>PRICE</th><th>24H</th><th>MARKET CAP</th><th>TREND</th><th></th></tr></thead><tbody>${coins.map(c=>`<tr><td><div class="asset">${icon(c)}<span>${c.name}<small class="muted" style="display:block;font-weight:500">${c.id}</small></span></div></td><td>${fmt(c.price)}</td><td class="${c.change>=0?'positive':'negative'}">${c.change>0?'+':''}${c.change.toFixed(2)}%</td><td>${c.cap}</td><td>${spark(c)}</td><td><button class="btn ghost sm" data-action="watch" data-coin="${c.id}">☆</button></td></tr>`).join('')}</tbody></table></div>`}
function marketMini(){return `<div class="market-mini">${coins.slice(0,3).map(c=>`<div class="coin-mini"><div class="coin-name"><span class="coin-icon">${c.symbol}</span>${c.id}</div><div class="price">${fmt(c.price)}</div><div class="small ${c.change>=0?'positive':'negative'}">${c.change>0?'+':''}${c.change.toFixed(2)}%</div></div>`).join('')}</div>`}
function home(){return `<main><section class="landing wrap"><div class="hero-grid"><div class="hero"><span class="pill"><span class="dot"></span> MARKET INTELLIGENCE · DEMO</span><div class="eyebrow" style="margin-top:25px">A clearer view of crypto markets</div><h1>Crypto, with<br><em>clarity.</em></h1><p>Track the market. Understand your portfolio. Make your next move with better information — not promises.</p><div class="hero-actions"><button class="btn" data-route="dashboard">Explore dashboard ↗</button><button class="btn ghost" data-route="markets">Explore markets</button></div><div class="trustrow"><span>✓ Market data with timestamps</span><span>✓ No guaranteed returns</span><span>✓ Demo mode</span></div></div><div class="card hero-visual"><div class="mini-head"><div><div class="muted small">DEMO PORTFOLIO VALUE</div><div class="balance">$24,680.42</div><div class="positive small">+3.24% <span class="muted">illustrative 24h change</span></div></div><span class="pill">● Sample data</span></div>${chart('heroChart',140)}<div class="mini-head"><span class="muted small">Market snapshot</span><button class="btn ghost sm" data-route="markets">View markets ↗</button></div>${marketMini()}</div></div></section>
<section class="section wrap" id="marketSection"><div class="section-head"><div><div class="eyebrow">Market overview</div><h2>Markets at a glance</h2><div class="muted">Reference prices for interface demonstration; verify current prices before making decisions.</div></div><button class="btn ghost" data-route="markets">View all markets →</button></div><div class="card cardpad">${marketsTable()}</div></section>
<section class="section wrap"><div class="section-head"><div><div class="eyebrow">Built for informed decisions</div><h2>Clarity in every corner.</h2></div></div><div class="feature-grid"><div class="card feature"><div class="feature-icon">⌁</div><h3>Market intelligence</h3><p>Explore asset prices, trends and market context in one focused view.</p></div><div class="card feature"><div class="feature-icon">◫</div><h3>Portfolio visibility</h3><p>See sample allocation, holdings and activity without inventing real returns.</p></div><div class="card feature"><div class="feature-icon">♢</div><h3>Security first</h3><p>Clear security guidance and a roadmap for production-grade account protection.</p></div></div><div class="risk"><b>Crypto risk warning:</b> Cryptocurrency prices are volatile and you can lose some or all of the money you invest. This demo does not accept deposits, execute trades, or promise profits. Portfolio values and transaction examples are illustrative.</div></section></main><footer class="footer"><div class="wrap">© 2026 Samuel Broker · Independent demo project. Not affiliated with Tesla, Inc. Cryptocurrency assets are high risk.</div></footer>`}
function sidebar(active){let groups=[['OVERVIEW',[['▦','Dashboard','dashboard'],['◉','Markets','markets'],['☆','Watchlist','watchlist']]],['PORTFOLIO',[['◫','My assets','assets'],['↔','Transactions','transactions']]],['RESOURCES',[['▤','Learn','learn'],['♢','Security','security'],['⚙','Settings','settings']]]];return `<aside class="sidebar" id="sidebar">${groups.map(([title,items])=>`<div class="side-label">${title}</div>${items.map(([i,n,r])=>`<a href="#${r}" class="navitem ${active===r?'active':''}" data-route="${r}"><span class="navicon">${i}</span>${n}</a>`).join('')}`).join('')}<div class="side-bottom"><div class="pill">DEMO ACCOUNT</div><p class="small muted">No real funds connected. Sample data only.</p><button class="btn ghost sm" style="width:100%" data-route="settings">Account settings</button></div></aside>`}
function dashboardPage(page){let title={dashboard:'Dashboard',markets:'Markets',watchlist:'Watchlist',assets:'My assets',transactions:'Transactions',learn:'Learn & insights',security:'Security center',settings:'Account settings'}[page]||'Dashboard';let body='';
if(page==='dashboard')body=`<div class="stats"><div class="card stat"><div class="stat-label">Demo portfolio value ⓘ</div><div class="stat-value">$24,680.42</div><div class="positive small">+3.24% <span class="muted">illustrative</span></div></div><div class="card stat"><div class="stat-label">Assets held</div><div class="stat-value">4</div><div class="muted small">Sample allocation</div></div><div class="card stat"><div class="stat-label">Watchlist</div><div class="stat-value" id="watchCount">${getWatch().length}</div><div class="muted small">Tracked assets</div></div><div class="card stat"><div class="stat-label">Account status</div><div class="stat-value" style="font-size:18px">Demo mode</div><div class="muted small">No deposits enabled</div></div></div><div class="dashboard-grid"><div class="card cardpad"><div class="panel-head"><div><div class="muted small">PORTFOLIO OVERVIEW</div><h2>Value over time <span class="pill">Illustrative</span></h2></div><div class="range">${['1D','1W','1M','1Y','ALL'].map((v,i)=>`<button class="${i===2?'active':''}" data-action="range">${v}</button>`).join('')}</div></div>${chart('dashChart',205)}<div class="muted small">Chart is illustrative and does not represent real investment performance.</div></div><div class="card cardpad"><div class="panel-head"><h2>Watchlist</h2><button class="btn ghost sm" data-route="watchlist">Manage →</button></div><div class="watchlist">${getWatch().slice(0,4).map(id=>{let c=coins.find(x=>x.id===id)||coins[0];return `<div class="watchrow"><div class="watchleft">${icon(c)}<div><b>${c.name}</b><small>${c.id}</small></div></div><div class="watchprice">${fmt(c.price)}<div class="${c.change>=0?'positive':'negative'} small">${c.change>0?'+':''}${c.change}%</div></div></div>`}).join('')||'<div class="empty">Your watchlist is empty. Add assets from Markets.</div>'}</div></div></div><div class="card cardpad" style="margin-top:15px"><div class="panel-head"><h2>Assets overview</h2><button class="btn ghost sm" data-route="assets">View assets →</button></div>${assetsTable()}</div>`;
else if(page==='markets')body=`<div class="card cardpad"><div class="panel-head"><div><h2>Cryptocurrency market</h2><div class="muted small">Reference data in this prototype may be static. Connect a verified provider for current market data.</div></div><input class="search" id="marketSearch" placeholder="Search assets…" aria-label="Search assets"></div><div id="marketTable">${marketsTable()}</div></div>`;
else if(page==='watchlist')body=`<div class="card cardpad"><div class="panel-head"><h2>Your watchlist</h2><button class="btn ghost sm" data-route="markets">Add assets +</button></div><div id="watchTable">${marketsTableForWatch()}</div></div>`;
else if(page==='assets')body=`<div class="stats"><div class="card stat"><div class="stat-label">Sample asset value</div><div class="stat-value">$24,680.42</div><div class="muted small">Illustrative only</div></div><div class="card stat"><div class="stat-label">Asset types</div><div class="stat-value">4</div><div class="muted small">Sample holdings</div></div></div><div class="card cardpad"><div class="panel-head"><h2>Asset allocation</h2><span class="pill">Sample portfolio</span></div>${assetsTable()}</div>`;
else if(page==='transactions')body=`<div class="card cardpad"><div class="panel-head"><div><h2>Transaction history</h2><div class="muted small">Example records only — not real financial transactions.</div></div><button class="btn ghost sm" data-action="export">Export sample CSV</button></div><div class="table-wrap"><table><thead><tr><th>TYPE</th><th>ASSET</th><th>DATE</th><th>STATUS</th><th>AMOUNT</th></tr></thead><tbody>${[['Buy','BTC','Oct 18, 2026','Demo record','$450.00'],['Buy','ETH','Oct 14, 2026','Demo record','$220.00'],['Receive','USDT','Oct 09, 2026','Demo record','$100.00'],['Buy','SOL','Oct 02, 2026','Demo record','$80.00']].map(x=>`<tr>${x.map((v,i)=>`<td>${i===3?'<span class="pill">'+v+'</span>':v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
else if(page==='learn')body=`<div class="feature-grid"><div class="card feature"><div class="feature-icon">₿</div><h3>Crypto basics</h3><p>Learn what blockchain networks are, how wallets work, and why custody matters.</p><button class="btn ghost sm" data-action="learn" data-topic="basics">Read guide →</button></div><div class="card feature"><div class="feature-icon">⚠</div><h3>Understand risk</h3><p>Volatility, liquidity, scams, and why past performance cannot predict future results.</p><button class="btn ghost sm" data-action="learn" data-topic="risk">Read guide →</button></div><div class="card feature"><div class="feature-icon">♢</div><h3>Wallet safety</h3><p>Protect recovery phrases, verify addresses, and beware of impersonation.</p><button class="btn ghost sm" data-action="learn" data-topic="wallet">Read guide →</button></div></div><div class="risk"><b>Education, not financial advice.</b> Research carefully and consider whether a highly volatile asset is suitable for your circumstances.</div>`;
else if(page==='security')body=`<div class="two-col"><div class="card cardpad"><div class="eyebrow">Account protection</div><h2>Security checklist</h2>${[['Strong unique password','Use a password manager and never reuse passwords.'],['Two-factor authentication','A production release should require TOTP or passkeys.'],['Identity verification','KYC checks require a compliant provider and secure backend.'],['Suspicious activity monitoring','Production monitoring and alerting are not connected in this demo.']].map(([h,p])=>`<div class="profile-row"><div class="feature-icon" style="margin:0">♢</div><div><b>${h}</b><div class="muted small">${p}</div></div></div>`).join('')}</div><div class="card cardpad"><div class="eyebrow">Platform status</div><h2>Demo environment</h2><p class="muted">No real deposits, withdrawals, trading, or identity checks are enabled. Never send funds to a demo site.</p><div class="risk">Do not enter real passwords, identity documents, wallet seed phrases, or banking details in this prototype.</div></div></div>`;
else body=`<div class="two-col"><div class="card cardpad"><div class="eyebrow">Profile</div><h2>Account information</h2><div class="profile-row"><div class="avatar">T</div><div><b id="profileEmail">${escapeHtml(getUser()||'Guest demo user')}</b><div class="muted small">Demo account</div></div></div><div class="profile-row"><div><b>Verification status</b><div class="muted small">Not verified — demo mode</div></div></div><button class="btn ghost" data-action="profile">Edit demo profile</button></div><div class="card cardpad"><div class="eyebrow">Preferences</div><h2>Account security</h2><p class="muted">Two-factor authentication and password recovery require production authentication services.</p><button class="btn ghost" data-route="security">Review security →</button><button class="btn" style="margin-left:8px" data-action="logout">Log out</button></div></div>`;
return `<div class="app-shell">${sidebar(page)}<main class="main"><div class="page-title"><div><div class="eyebrow">SAMUEL BROKER / ${title.toUpperCase()}</div><h1>${title}</h1><div class="muted small">Welcome back${getUser()?', '+escapeHtml(getUser().split('@')[0]):''}. Here is your demo workspace.</div></div><span class="pill"><span class="dot"></span> Demo environment</span></div>${body}<div class="risk"><b>Risk notice:</b> Crypto assets are volatile and you may lose your entire investment. This prototype uses sample balances and records; no real trading or deposits are available.</div></main></div><nav class="mobile-nav">${[['▦','Home','dashboard'],['⌁','Markets','markets'],['☆','Watchlist','watchlist'],['◫','Assets','assets'],['☰','More','settings']].map(([i,n,r])=>`<button class="${page===r?'active':''}" data-route="${r}"><span>${i}</span>${n}</button>`).join('')}</nav>`;
}
function assetsTable(){return `<div class="table-wrap"><table><thead><tr><th>ASSET</th><th>HOLDINGS</th><th>PRICE</th><th>VALUE</th><th>ALLOCATION</th></tr></thead><tbody>${[['BTC','0.21',coins[0],14158.24,'57.4%'],['ETH','2.40',coins[1],8468.74,'34.3%'],['SOL','8.50',coins[2],1396.30,'5.7%'],['USDT','657.14',coins[3],657.14,'2.6%']].map(([id,amount,c,val,alloc])=>`<tr><td><div class="asset">${icon(c)}<span>${c.name}<small class="muted" style="display:block">${id}</small></span></div></td><td>${amount}</td><td>${fmt(c.price)}</td><td>${fmt(val)}</td><td>${alloc}</td></tr>`).join('')}</tbody></table></div>`}
function getWatch(){try{return JSON.parse(localStorage.getItem('tb_watch')||'["BTC","ETH","SOL"]')}catch{return ['BTC','ETH','SOL']}}
function marketsTableForWatch(){let w=getWatch();return `<div class="table-wrap"><table><thead><tr><th>ASSET</th><th>PRICE</th><th>24H</th><th>MARKET CAP</th><th></th></tr></thead><tbody>${coins.filter(c=>w.includes(c.id)).map(c=>`<tr><td><div class="asset">${icon(c)}${c.name} <small class="muted">${c.id}</small></div></td><td>${fmt(c.price)}</td><td class="${c.change>=0?'positive':'negative'}">${c.change}%</td><td>${c.cap}</td><td><button class="btn ghost sm" data-action="watch" data-coin="${c.id}">Remove ☆</button></td></tr>`).join('')||'<tr><td colspan="5">Your watchlist is empty. Visit Markets to add assets.</td></tr>'}</tbody></table></div>`}
function getUser(){return localStorage.getItem('tb_demo_email')||''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let route=location.hash.replace('#','')||'home';if(route==='login'||route==='register'){ $('#app').innerHTML=`<main class="wrap"><div class="form-wrap card cardpad"><div class="brand"><span class="brandmark">T</span><span>SAMUEL <span>BROKER</span></span></div><div class="eyebrow" style="margin-top:28px">${route==='login'?'WELCOME BACK':'CREATE DEMO ACCOUNT'}</div><h1>${route==='login'?'Log in to your workspace':'Get started'}</h1><p class="muted">${route==='login'?'Continue to your demo dashboard.':'Create a local demo profile to explore the interface.'}</p><form id="authForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="${route==='login'?'current-password':'new-password'}"></div><button class="btn" style="width:100%" type="submit">${route==='login'?'Log in to demo':'Create demo account'} ↗</button></form><p class="form-note">Demo only: this does not create a secure server account. Do not use a real password.</p><p class="muted small">${route==='login'?'New here?':'Already have a demo profile?'} <a style="color:var(--cyan)" href="#${route==='login'?'register':'login'}">${route==='login'?'Create demo account':'Log in'}</a></p><button class="btn ghost" data-route="home">← Back to home</button></div></main>`;return}
if(['dashboard','markets','watchlist','assets','transactions','learn','security','settings'].includes(route)){ $('#app').innerHTML=dashboardPage(route); $('#avatar').textContent=getUser()?getUser()[0].toUpperCase():'T'; return}
$('#app').innerHTML=home();$('#avatar').textContent=getUser()?getUser()[0].toUpperCase():'T';
}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),3000)}
document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r){e.preventDefault();location.hash=r.dataset.route;$('#sidebar')?.classList.remove('open');return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='watch'){let id=b.dataset.coin,w=getWatch();if(w.includes(id))w=w.filter(x=>x!==id);else w.push(id);localStorage.setItem('tb_watch',JSON.stringify(w));render();toast(w.includes(id)?id+' added to watchlist':id+' removed from watchlist')}else if(a==='range'){ $$('.range button').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Selected '+b.textContent+' view (illustrative chart)')}else if(a==='export'){let csv='Type,Asset,Date,Status,Amount\\nBuy,BTC,"Oct 18 2026",Demo record,450.00\\nBuy,ETH,"Oct 14 2026",Demo record,220.00\\nReceive,USDT,"Oct 09 2026",Demo record,100.00\\nBuy,SOL,"Oct 02 2026",Demo record,80.00';let url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let x=document.createElement('a');x.href=url;x.download='samuel-broker-sample-transactions.csv';x.click();URL.revokeObjectURL(url);toast('Sample CSV exported')}else if(a==='logout'){localStorage.removeItem('tb_demo_email');location.hash='home';toast('Logged out of demo profile')}else if(a==='profile'){toast('Profile editing is not connected in this demo')}else if(a==='learn'){let m={basics:'Blockchain is a shared ledger maintained by a network. Learn about wallets, custody, fees, and how transactions are confirmed before using crypto.',risk:'Crypto can be extremely volatile. You may lose all funds; beware of leverage, fake support accounts, guaranteed-return claims, and liquidity risks.',wallet:'Never share a recovery phrase. Check network and address carefully, use reputable wallet software, and test with small amounts when appropriate.'};alert(m[b.dataset.topic])}});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();let email=$('#email').value.trim(),pw=$('#password').value;if(!email||pw.length<8)return;localStorage.setItem('tb_demo_email',email);location.hash='dashboard';toast('Demo profile ready. No server account was created.')}});
document.addEventListener('input',e=>{if(e.target.id==='marketSearch'){let q=e.target.value.toLowerCase();let filtered=coins.filter(c=>(c.name+c.id).toLowerCase().includes(q));let root=$('#marketTable');if(root)root.innerHTML=`<div class="table-wrap"><table><thead><tr><th>ASSET</th><th>PRICE</th><th>24H</th><th>MARKET CAP</th><th>TREND</th><th></th></tr></thead><tbody>${filtered.map(c=>`<tr><td><div class="asset">${icon(c)}<span>${c.name}<small class="muted" style="display:block">${c.id}</small></span></div></td><td>${fmt(c.price)}</td><td class="${c.change>=0?'positive':'negative'}">${c.change}%</td><td>${c.cap}</td><td>${spark(c)}</td><td><button class="btn ghost sm" data-action="watch" data-coin="${c.id}">☆</button></td></tr>`).join('')}</tbody></table></div>`}});
$('#menuToggle').addEventListener('click',()=>$('#sidebar')?.classList.toggle('open'));
window.addEventListener('hashchange',render);
render();
</script>
</body></html>
